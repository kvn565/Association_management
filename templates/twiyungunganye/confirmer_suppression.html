{% extends 'twiyungunganye/base.html' %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="fw-bold text-danger mb-3">Confirmer la suppression</h3>
                    <p class="text-muted mb-1">{{ titre }}</p>
                    {% if message %}
                    <p class="mb-4">{{ message }}</p>
                    {% endif %}
                    <form method="post" class="d-flex justify-content-center gap-3">
                        {% csrf_token %}
                        <a href="{% url url_annuler %}" class="btn btn-secondary btn-lg">
                            <i class="bi bi-x-circle me-1"></i> Annuler
                        </a>
                        <button type="submit" class="btn btn-danger btn-lg">
                            <i class="bi bi-trash me-1"></i> Supprimer
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
