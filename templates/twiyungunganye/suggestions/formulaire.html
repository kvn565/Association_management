{% extends 'twiyungunganye/base.html' %}
{% block title %}Soumettre une suggestion{% endblock %}
{% block content %}
<h2><i class="bi bi-lightbulb"></i> Soumettre une suggestion</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Soumettre</button>
            <a href="{% url 'liste_suggestions' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
<style>form p {margin-bottom: 1rem;} form p label {display: block; font-weight: 600; margin-bottom: 0.5rem;} form p input, form p textarea {width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 0.375rem;}</style>
{% endblock %}
